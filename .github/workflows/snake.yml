
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: diyasaxena17
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#8B5CF6&color_dots=#EBE9F5,#DDD6FE,#C4B5FD,#A78BFA,#7C3AED
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C4B5FD&color_dots=#161B22,#4C1D95,#6D28D9,#8B5CF6,#C4B5FD

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
